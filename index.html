<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reel Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 480px;
        }
        h2 {
            color: #333;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #e1306c;
        }
        button {
            margin-top: 15px;
            width: 100%;
            background: #e1306c;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #c13584;
        }
        .result-box {
            margin-top: 25px;
        }
        .loader {
            display: none;
            font-weight: bold;
            color: #e1306c;
        }
        .dl-btn {
            display: inline-block;
            background: #28a745;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }
        .dl-btn:hover {
            background: #218838;
        }
        .error-msg {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Instagram Reel Downloader</h2>
    <p class="subtitle">Paste the Instagram Reel link below</p>
    
    <input type="text" id="reelUrl" placeholder="https://www.instagram.com/reel/...">
    <button onclick="downloadReel()">Download Reel</button>

    <div class="result-box">
        <div id="loader" class="loader">Processing video, please wait...</div>
        <div id="result"></div>
    </div>
</div>

<script>
    async function downloadReel() {
        const urlInput = document.getElementById('reelUrl').value.trim();
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');

        result.innerHTML = '';

        if (!urlInput) {
            alert('Please enter a valid Instagram Reel link!');
            return;
        }

        loader.style.display = 'block';

        try {
            const apiUrl = `https://api.cobalt.tools/api/json`;
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: urlInput
                })
            });

            const data = await response.json();
            loader.style.display = 'none';

            if (data && data.url) {
                result.innerHTML = `
                    <p style="color: green; font-weight: bold; margin-bottom: 8px;">Video Ready!</p>
                    <a class="dl-btn" href="${data.url}" target="_blank" download>Download Video</a>
                `;
            } else {
                result.innerHTML = `<p class="error-msg">Failed to fetch video. Make sure the account is public and the link is valid.</p>`;
            }
        } catch (error) {
            loader.style.display = 'none';
            result.innerHTML = `<p class="error-msg">Error connecting to the server. Please try again later.</p>`;
        }
    }
</script>

</body>
</html>
